---
- name: Deploy Label Studio with SRAM authentication
  hosts: localhost
  become: yes
  gather_facts: true

  vars:
    app_dir: /opt/label-studio
    label_studio_version: "latest"
    # Local user for Label Studio (created automatically on first SRAM login)
    # Label Studio data will persist in Docker volume
    
    # RSC Catalog variables (these will be provided by SURF Research Cloud)
    # public_fqdn: "{{ rsc_nginx_service_url }}"  # Will be set by RSC
    # The nginx plugin will handle SSL/TLS and basic auth setup

  pre_tasks:
    - name: Wait for system to become reachable
      wait_for_connection:
        timeout: 300

    - name: Gather facts
      setup:

    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

  tasks:
    # ============================================================
    # Docker Installation
    # ============================================================
    - name: Install Docker prerequisites (Debian/Ubuntu)
      apt:
        name: 
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key (Debian/Ubuntu)
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when: ansible_os_family == "Debian"

    - name: Add Docker repository (Debian/Ubuntu)
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} stable
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine and Compose plugin
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker (RedHat/CentOS)
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    # ============================================================
    # Application Directory Setup
    # ============================================================
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Create Label Studio data directory
      file:
        path: "{{ app_dir }}/data"
        state: directory
        mode: "0755"

    # ============================================================
    # Docker Compose Configuration
    # ============================================================
    - name: Write docker-compose.yml for Label Studio with PostgreSQL
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          version: "3.9"
          
          services:
            # ===========================================
            # PostgreSQL Database
            # ===========================================
            postgres:
              image: postgres:15-alpine
              container_name: label-studio-postgres
              restart: unless-stopped
              environment:
                - POSTGRES_USER=labelstudio
                - POSTGRES_PASSWORD=labelstudio_password
                - POSTGRES_DB=labelstudio
              volumes:
                - postgres-data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U labelstudio -d labelstudio"]
                interval: 5s
                timeout: 5s
                retries: 5
                start_period: 10s

            # ===========================================
            # Label Studio Application
            # ===========================================
            label-studio:
              image: heartexlabs/label-studio:{{ label_studio_version }}
              container_name: label-studio
              restart: unless-stopped
              depends_on:
                postgres:
                  condition: service_healthy
              ports:
                - "127.0.0.1:8080:8080"
              volumes:
                - label-studio-data:/label-studio/data
              environment:
                # ===========================================
                # PostgreSQL Database Connection
                # ===========================================
                - DJANGO_DB=default
                - POSTGRE_NAME=labelstudio
                - POSTGRE_USER=labelstudio
                - POSTGRE_PASSWORD=labelstudio_password
                - POSTGRE_HOST=postgres
                - POSTGRE_PORT=5432
                
                # ===========================================
                # Disable internal authentication - SRAM handles auth
                # ===========================================
                - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
                
                # ===========================================
                # Application settings
                # ===========================================
                - LABEL_STUDIO_HOST={{ '${LABEL_STUDIO_HOST:-http://localhost:8080}' }}
<<<<<<< HEAD
                # Default role for users
=======
>>>>>>> 097943a01fd98036565525fff5606d4e8fe65f97
                - LABEL_STUDIO_USER_DEFAULT_ROLE=annotator

          volumes:
            postgres-data:
            label-studio-data:

    # ============================================================
    # Deploy Docker Compose Stack
    # ============================================================
    - name: Start PostgreSQL and Label Studio services
      shell: |
        cd {{ app_dir }}
        docker compose up -d
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for PostgreSQL container to be healthy
      shell: docker inspect -f {% raw %}'{{.State.Health.Status}}'{% endraw %} label-studio-postgres
      register: postgres_health
      until: postgres_health.stdout == 'healthy'
      retries: 30
      delay: 5

    - name: Wait for Label Studio container to be running
      shell: docker inspect -f {% raw %}'{{.State.Running}}'{% endraw %} label-studio
      register: container_running
      until: container_running.stdout == 'true'
      retries: 30
      delay: 10

    - name: Wait for Label Studio to respond on port 8080
      wait_for:
        host: 127.0.0.1
        port: 8080
        delay: 10
        timeout: 300
        state: started

    - name: Additional wait for Label Studio to fully initialize
      pause:
        seconds: 30

    # ============================================================
    # Nginx Configuration for SRAM Authentication
    # ============================================================
    - name: Create nginx app location config for Label Studio
      copy:
        dest: /etc/nginx/app-location-conf.d/labelstudio.conf
        mode: 0644
        content: |
          # Label Studio Main Application
          location / {
              error_page 401 = @custom_401;
              auth_request /validate;
              auth_request_set $username $upstream_http_username;
              
              proxy_pass http://127.0.0.1:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              
              # Pass authenticated username to Label Studio
              proxy_set_header REMOTE_USER $username;
              proxy_set_header X-Forwarded-User $username;
              
              # Standard timeouts
              proxy_connect_timeout 300;
              proxy_send_timeout 300;
              proxy_read_timeout 300;
              
              # Handle large file uploads for data import
              client_max_body_size 100M;
              proxy_request_buffering off;
          }

          # WebSocket support for real-time updates
          location /ws {
              error_page 401 = @custom_401;
              auth_request /validate;
              
              proxy_pass http://127.0.0.1:8080/ws;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              
              proxy_read_timeout 86400;
          }

          # API endpoints
          location /api {
              error_page 401 = @custom_401;
              auth_request /validate;
              auth_request_set $username $upstream_http_username;
              
              proxy_pass http://127.0.0.1:8080/api;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header REMOTE_USER $username;
              proxy_set_header X-Forwarded-User $username;
              
              proxy_connect_timeout 300;
              proxy_send_timeout 300;
              proxy_read_timeout 300;
              
              # Handle large file uploads
              client_max_body_size 100M;
              proxy_request_buffering off;
          }

          # Static files (can be served without buffering issues)
          location /static {
              error_page 401 = @custom_401;
              auth_request /validate;
              
              proxy_pass http://127.0.0.1:8080/static;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              
              # Cache static files
              proxy_cache_valid 200 1d;
              expires 1d;
          }

          # Media/uploaded files
          location /data {
              error_page 401 = @custom_401;
              auth_request /validate;
              
              proxy_pass http://127.0.0.1:8080/data;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Health check endpoint (no auth needed for monitoring)
          location /health {
              proxy_pass http://127.0.0.1:8080/health;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
          }
      notify: reload nginx

    # ============================================================
    # Nginx Map for WebSocket Upgrade
    # ============================================================
    - name: Ensure map directive for WebSocket upgrade exists
      blockinfile:
        path: /etc/nginx/conf.d/map-upgrade.conf
        create: yes
        mode: 0644
        marker: "# {mark} ANSIBLE MANAGED BLOCK - WebSocket"
        block: |
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
          }
      notify: reload nginx

  handlers:
    - name: reload nginx
      service:
        name: nginx
        state: reloaded

  post_tasks:
    - name: Display deployment information
      debug:
        msg:
          - "=================================="
          - "Label Studio Deployment Complete"
          - "=================================="
          - "Service URL: https://{{ rsc_nginx_service_url | default('your-domain.nl') }}"
          - "Version: {{ label_studio_version }}"
          - ""
          - "Authentication: SRAM SSO"
          - "Users must log in with their institutional credentials"
          - ""
          - "Services running:"
          - "  - PostgreSQL: label-studio-postgres (port 5432)"
          - "  - Label Studio: http://localhost:8080"
          - "  - Public access via nginx with SRAM auth"
          - ""
          - "Data stored in Docker volumes:"
          - "  - postgres-data (database)"
          - "  - label-studio-data (uploads/files)"
          - "=================================="
